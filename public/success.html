<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Successful — SmartBio Books</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f5f8f6;
      color: #16302a;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0001;
    }

    h1 {
      color: #0b5d45;
    }

    .download {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #0b5d45;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    #message {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Payment Successful 🎉</h1>

    <p>
      Thank you for purchasing <strong>Organisms</strong>
      from SmartBio Books.
    </p>

    <p>
      Your payment is being verified.
    </p>

    <a
      id="download"
      class="download"
      href="#"
    >
      Download Organisms PDF
    </a>

    <p id="message"></p>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const reference = params.get("reference");

    const downloadButton =
      document.getElementById("download");

    const message =
      document.getElementById("message");

    if (reference) {

      downloadButton.href =
        "/api/download?reference=" +
        encodeURIComponent(reference);

    } else {

      downloadButton.style.display = "none";

      message.textContent =
        "Payment reference was not found.";

    }

  </script>

</body>
</html>
